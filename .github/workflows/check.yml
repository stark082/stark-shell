name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Bash lint tools
        run: command -v shellcheck && command -v jq && command -v patch
      - name: Python correctness lint
        run: |
          python3 -m pip install ruff==0.14.4
          ruff check --select E9,F63,F7,F82 tools tests
          python3 -m compileall -q tools tests
      - name: Package consistency
        run: python3 tools/check.py
      - name: Isolated lifecycle and focus regressions
        run: ./tests/run.sh
